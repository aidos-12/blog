{% extends 'base.html' %}

{% block title %}Новый пароль - Blog System{% endblock %}

{% block content %}
    <h2>Задайте новый пароль</h2>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Сохранить новый пароль</button>
        </form>
    {% else %}
        <p>Ссылка недействительна или уже была использована</p>
    {% endif %}
{% endblock %}
