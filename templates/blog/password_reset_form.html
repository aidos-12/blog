{% extends 'base.html' %}

{% block title %}Восстановление пароля - Blog System{% endblock %}

{% block content %}
    <h2>Восстановление пароля</h2>

    <p>
        Введите ваш email, указанный при регистрации —
        мы отправим ссылку для сброса пароля.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Отправить</button>
    </form>
{% endblock %}
