{% extends 'base.html' %}

{% block title %}Удаление категории - Blog System{% endblock %}

{% block content %}

<h2>Удалить категорию?</h2>

<p>Вы уверены, что хотите удалить категорию{{ category.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'category_detail' category_id=category.id %}">Отмена</a>
</form>
{% endblock %}
