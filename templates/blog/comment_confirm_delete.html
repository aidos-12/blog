{% extends 'base.html' %}

{% block title %}Удаление комментария - Blog System{% endblock %}

{% block content %}

<h2>Удалить комментарий?</h2>

<p>
    {{ comment.text_comment }}
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Удалить</button>

    <a href="{% url 'post_detail' post_id=comment.post.id %}">
        Отмена
    </a>
</form>

{% endblock %}
